<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Plataforma de gestão e apoio para ONGs do Terceiro Setor. Acessível, rápida e inclusiva." />
  <title>Plataforma Terceiro Setor - Acessibilidade & Impacto Social</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Skip Link para acessibilidade via teclado (WCAG 2.4.1) -->
  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

  <header role="banner" class="main-header">
    <div class="container header-container">
      <div class="brand">
        <h1>Plataforma Terceiro Setor</h1>
      </div>
      
      <nav role="navigation" aria-label="Navegação Principal" class="main-nav">
        <ul>
          <li><a href="#/inicio" class="nav-link">Início</a></li>
          <li><a href="#/projetos" class="nav-link">Projetos</a></li>
          <li><a href="#/cadastro" class="nav-link">Cadastrar ONG</a></li>
        </ul>
      </nav>

      <div class="theme-toggle-container">
        <button id="theme-toggle" class="btn-theme" aria-label="Alternar modo de alto contraste" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">🌓</span>
          <span class="theme-label">Alto Contraste</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Elemento de notificação dinâmica para leitores de tela (WCAG 4.1.3) -->
  <div id="aria-announcer" class="sr-only" role="status" aria-live="polite"></div>

  <main id="main-content" role="main" tabindex="-1">
    <div id="app" class="container">
      <!-- O conteúdo das páginas (SPA) é renderizado dinamicamente via JS -->
    </div>
  </main>

  <footer role="contentinfo" class="main-footer">
    <div class="container footer-container">
      <p>&copy; 2026 Plataforma Terceiro Setor. Todos os direitos reservados.</p>
      <p>Desenvolvido com foco em acessibilidade e transparência conforme diretrizes WCAG 2.1 AA.</p>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
